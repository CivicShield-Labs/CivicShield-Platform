server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 64KB

spring:
  application:
    name: civicshield-platform

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/civicshield}
    username: ${DATABASE_USERNAME:civicshield}
    password: ${DATABASE_PASSWORD:civicshield_local_only}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  security:
    user:
      name: ${CIVICSHIELD_ADMIN_USER:civicshield}
      password: ${CIVICSHIELD_ADMIN_PASSWORD}

civicshield:
  security:
    admin-agency-id: ${CIVICSHIELD_ADMIN_AGENCY_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized
