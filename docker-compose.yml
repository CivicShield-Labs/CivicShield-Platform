services:
  postgres:
    image: postgres:16
    container_name: civicshield-postgres
    environment:
      POSTGRES_DB: civicshield
      POSTGRES_USER: civicshield
      POSTGRES_PASSWORD: civicshield_local_only
    ports:
      - "5432:5432"
    volumes:
      - civicshield-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicshield -d civicshield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  civicshield-postgres-data:
